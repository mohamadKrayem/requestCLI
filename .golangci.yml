version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - misspell
    - revive

  exclusions:
    rules:
      # Assertions in tests are checked by the test itself.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
