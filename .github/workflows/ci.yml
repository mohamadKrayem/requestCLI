name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Build
        run: go build ./...

      - name: End-to-end smoke test
        run: bash scripts/smoke.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # v8 installs golangci-lint v2.x, which the v2-format .golangci.yml
      # requires and which is built with a Go new enough for this module.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The script builds both targets through compose and then runs real
      # requests against the containerised fixture server.
      - name: Container smoke test
        run: VERSION=ci bash scripts/docker-smoke.sh

      # Cross-compilation only; nothing is pushed. Catches an arm64 break
      # before a release tag does.
      - name: Cross-build linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          build-args: |
            VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
